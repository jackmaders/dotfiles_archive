format = "$directory$git_branch$git_status$character"
right_format = "$time"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%R"
style = "bright-black"

[directory]
style = "bold cyan"

[character]
success_symbol = "[❯](bold purple)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[git_branch]
format = "[$branch]($style) "
style = "bold black"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"

[cmd_duration]
format = "[$duration]($style) "
style = "bold yellow"
